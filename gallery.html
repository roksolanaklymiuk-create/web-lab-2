<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея</title>
    <style>
        h1 {
            text-align: center;
            font-size: 20px;
        }

        .back {
            font-style: italic;
        }

        h2 {
            text-align: center;
        }

        h3 {
            text-align: center;
        }

        .small {
            font-size: 0.7em;
        }

        .big {
            font-size: 1.3em;
        }

        .container {
            font-size: 1.3em;
        }

        img {
            display: block;
            margin: 0 auto;
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <h1>Галерея Клим`юк Роксолани</h1>

    <p><a href="index.html" class="back">Назад на головну</a></p>

    <div class="gallery">
        <h2>Мої зображення</h2>

        <h3 class="small">Зображення у цій папці</h3>
        <img src="photo.png" alt="Моє фото">

        <h3 class="big">Зображення у папці</h3>
        <img src="images/photo1.png" alt="Фото з папки">

        <div class="container">
            <h3 class="big">Зображення онлайн</h3>
            <img src="https://placehold.co/1280x1024.png" width="1280" height="1024" alt="Зображення онлайн">
        </div>
    </div>
</body>
</html>
