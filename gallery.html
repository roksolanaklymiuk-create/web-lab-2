<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Галерея</title>
    <style>
        /* Заголовок по центру, 20px */
        h1 {
            text-align: center;
            font-size: 20px;
        }
        /* Назад на головну курсивом */
        a.back-link {
            font-style: italic;
        }
        h2.main-title {
            text-align: center;
            font-size: 20px; /* Базовий розмір */
        }
        /* Заголовок на 30% менший */
        h2.title-smaller {
            text-align: center;
            font-size: 70%; 
        }
        /* Заголовок на 30% більший */
        h2.title-larger {
            text-align: center;
            font-size: 130%; 
        }
        /* Заголовок ще на 30% більший від попереднього (130% * 1.3 = 169%) */
        h2.title-largest {
            text-align: center;
            font-size: 169%; 
        }
        /* Усі зображення по центру */
        .img-container {
            text-align: center;
            margin-bottom: 20px;
        }
        img {
            max-width: 600px; /* Обмеження ширини для гарного вигляду */
            height: auto;
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <h1>Галерея Клим`юк Роксолани</h1>
    <a href="index.html" class="back-link">Назад на головну</a>

    <h2 class="main-title">Мої зображення</h2>
    
    <h2 class="title-smaller">Зображення у цій папці</h2>
    <div class="img-container">
        <!-- Помістіть сюди картинку, яка лежить в одній папці з HTML -->
        <img src="photo.jpg" alt="Моє фото">
    </div>

    <h2 class="title-larger">Зображення у папці</h2>
    <div class="img-container">
        <!-- Помістіть сюди картинку, яка лежить у папці images -->
        <img src="images/photo.jpg" alt="Фото з папки">
    </div>

    <h2 class="title-largest">Зображення онлайн</h2>
    <div class="img-container">
        <!-- Зображення за посиланням з інтернету -->
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Carpathian_National_University.jpg/800px-Carpathian_National_University.jpg" alt="ПНУ">
    </div>
</body>
</html>
